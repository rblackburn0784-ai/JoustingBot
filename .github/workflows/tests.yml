name: JoustingBot tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python code
        run: python -m compileall -q main.py cogs services tests
      - name: Run competition regression tests
        run: python -m unittest discover -s tests -v
      - name: Sweep tactical balance across all six arenas
        run: python tools/simulate_balance_v296.py --seeds 200 --defence-check
      - name: Audit graphical asset inventory (local-only packs are warnings)
        run: |
          python - <<'PY'
          from services.asset_health import audit_assets
          report = audit_assets()
          print(f"Graphics: {report['present']}/{report['expected']} installed; missing {report['missing']}")
          for group, totals in report['groups'].items():
              print(f"{group}: {totals['present']}/{totals['expected']}")
          for issue in report["errors"]:
              print("::error::" + issue)
          if report["errors"]:
              raise SystemExit(1)
          if report["missing"]:
              print("::warning::Optional/local-only graphical packs are absent from GitHub. "
                    "Run /admin assets on the deployed bot to verify its own files.")
          PY
      - name: Check Discord cog and slash command registration
        run: |
          python - <<'PY'
          import asyncio
          import discord
          from discord.ext import commands

          async def check():
              async with commands.Bot(command_prefix="!", intents=discord.Intents.default()) as bot:
                  for module in (
                      "cogs.menu", "cogs.knight", "cogs.horse",
                      "cogs.equipment", "cogs.arena", "cogs.joust",
                      "cogs.profile", "cogs.competition", "cogs.tournament", "cogs.maintenance", "cogs.evolution", "cogs.circuit",
                  ):
                      await bot.load_extension(module)
                  names = {command.name for command in bot.tree.get_commands()}
                  assert {"menu", "profile", "titles", "title", "leaderboard", "knight", "horse", "joust", "tournament", "version", "maintenance", "admin", "headquarters", "daily", "stable", "presets", "circuit", "house", "herald", "hall"} <= names, names
                  admin = bot.tree.get_command("admin")
                  assert {"panel", "backup", "repair", "reset_user", "health"} <= {sub.name for sub in admin.commands}
                  print("All cogs loaded; slash commands registered.")

          asyncio.run(check())
          PY
